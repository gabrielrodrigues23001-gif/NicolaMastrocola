<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: rgba(33, 37, 41, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        .login-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-type-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .user-type-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .user-type-card.active {
            background: rgba(13, 110, 253, 0.2);
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card login-card shadow-lg">
                    <div class="card-body p-5">
                        <!-- Logo e Título -->
                        <div class="text-center mb-4">
                            <i class="bi bi-journal-bookmark-fill display-4 text-primary"></i>
                            <h1 class="h3 mt-3 text-white">Sistema Escolar</h1>
                            <p class="text-muted">Faça login para continuar</p>
                        </div>

                        <!-- Tipos de Usuário -->
                        <div class="row g-2 mb-4">
                            <div class="col-4">
                                <div class="user-type-card text-center p-3" onclick="selecionarTipo('diretor')">
                                    <i class="bi bi-person-gear display-6 text-warning"></i>
                                    <small class="d-block mt-2">Diretor</small>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="user-type-card text-center p-3" onclick="selecionarTipo('proatec')">
                                    <i class="bi bi-person-check display-6 text-info"></i>
                                    <small class="d-block mt-2">PROATEC</small>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="user-type-card text-center p-3" onclick="selecionarTipo('professor')">
                                    <i class="bi bi-person display-6 text-success"></i>
                                    <small class="d-block mt-2">Professor</small>
                                </div>
                            </div>
                        </div>

                        <!-- Formulário de Login -->
                        <form method="POST" action="/login">
                            {% if error %}
                            <div class="alert alert-danger d-flex align-items-center" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                {{ error }}
                            </div>
                            {% endif %}

                            <div class="mb-3">
                                <label for="username" class="form-label text-white">
                                    <i class="bi bi-person-circle me-2"></i>Usuário
                                </label>
                                <input type="text" class="form-control bg-dark border-dark text-white" 
                                       id="username" name="username" required 
                                       placeholder="Digite seu usuário">
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label text-white">
                                    <i class="bi bi-key me-2"></i>Senha
                                </label>
                                <input type="password" class="form-control bg-dark border-dark text-white" 
                                       id="password" name="password" required 
                                       placeholder="Digite sua senha">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </form>

                        <!-- Credenciais de Teste -->
                        <div class="mt-4">
                            <div class="accordion" id="credenciaisAccordion">
                                <div class="accordion-item bg-dark">
                                    <h2 class="accordion-header">
                                        <button class="accordion-button bg-dark text-white collapsed" 
                                                type="button" data-bs-toggle="collapse" 
                                                data-bs-target="#credenciaisCollapse">
                                            <i class="bi bi-info-circle me-2"></i>Credenciais de Teste
                                        </button>
                                    </h2>
                                    <div id="credenciaisCollapse" class="accordion-collapse collapse">
                                        <div class="accordion-body">
                                            <small class="text-muted">
                                                <strong>Diretor:</strong> usuário: diretor, senha: 123456<br>
                                                <strong>PROATEC:</strong> usuário: proatec, senha: proatec123<br>
                                                <strong>Professor:</strong> usuário: professor, senha: prof123
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <small class="text-white-50">
                        💻 Desenvolvido por <strong>Guilherme Francheto Corse</strong>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selecionarTipo(tipo) {
            // Remove active class de todos os cards
            document.querySelectorAll('.user-type-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Adiciona active class ao card clicado
            event.currentTarget.classList.add('active');
            
            // Preenche automaticamente o usuário baseado no tipo
            const usernameField = document.getElementById('username');
            if (tipo === 'diretor') {
                usernameField.value = 'diretor';
            } else if (tipo === 'proatec') {
                usernameField.value = 'proatec';
            } else if (tipo === 'professor') {
                usernameField.value = 'professor';
            }
            
            // Foca no campo de senha
            document.getElementById('password').focus();
        }

        // Auto-focus no campo de usuário
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
